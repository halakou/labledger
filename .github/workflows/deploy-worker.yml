name: deploy-worker

on:
  push:
    paths:
      - "cloudflare/**"
      - ".github/workflows/deploy-worker.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Deploy worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          wranglerVersion: "4.135.0"
          workingDirectory: cloudflare
          command: deploy --config wrangler.toml
      - name: Set worker secrets
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          DISPATCH_TOKEN: ${{ secrets.DISPATCH_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          cd cloudflare
          if [ -n "$TELEGRAM_BOT_TOKEN" ]; then
            printf '%s' "$TELEGRAM_BOT_TOKEN" | npx --yes wrangler@4.135.0 secret put TELEGRAM_BOT_TOKEN
          fi
          if [ -n "$DISPATCH_TOKEN" ]; then
            printf '%s' "$DISPATCH_TOKEN" | npx --yes wrangler@4.135.0 secret put DISPATCH_TOKEN
          fi
