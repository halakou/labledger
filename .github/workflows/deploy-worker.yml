name: deploy-worker

on:
  push:
    paths:
      - "cloudflare/**"
      - ".github/workflows/deploy-worker.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          wranglerVersion: "4.135.0"
          workingDirectory: cloudflare
          command: deploy --config wrangler.toml
      - name: Give the Worker a GitHub dispatch token
        if: ${{ secrets.GITHUB_DISPATCH_TOKEN != '' }}
        working-directory: cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          GITHUB_DISPATCH_TOKEN: ${{ secrets.GITHUB_DISPATCH_TOKEN }}
        run: printf '%s' "$GITHUB_DISPATCH_TOKEN" | npx --yes wrangler@4.135.0 secret put GITHUB_DISPATCH_TOKEN --name labledger-desk --config wrangler.toml
