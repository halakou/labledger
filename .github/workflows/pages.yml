name: pages

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/cache/restore@v4
        with:
          path: .desk-posted.json
          key: desk-posted-${{ github.run_id }}
          restore-keys: |
            desk-posted-
      - name: Build desk
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_CHANNEL_URL: ${{ secrets.TELEGRAM_CHANNEL_URL }}
          SITE_URL: https://labledgerdesk.pages.dev
        run: node scripts/build-desk.mjs
      - name: Publish public site
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          wranglerVersion: "4.135.0"
          command: deploy --config cloudflare/labledgerdesk.toml
      - name: Publish pages.dev
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          wranglerVersion: "4.135.0"
          command: pages deploy dist-site --project-name=labledgerdesk --branch=main --commit-dirty=true
      - name: Post to Telegram after pages exist
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_CHANNEL_URL: ${{ secrets.TELEGRAM_CHANNEL_URL }}
          SITE_URL: https://labledgerdesk.pages.dev
        run: node scripts/telegram-desk.mjs
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: .desk-posted.json
          key: desk-posted-${{ github.run_id }}
