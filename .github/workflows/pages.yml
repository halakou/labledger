name: pages

on:
  push:
    branches: [main]
  schedule:
    # Hourly backup if the clock workflow is silent. GitHub keeps hourly.
    - cron: "8 * * * *"
    # Weekly re-enable so GitHub does not disable schedules after 60 quiet days.
    - cron: "19 4 * * 1"
  workflow_dispatch:
  workflow_run:
    workflows: ["clock"]
    types: [completed]

concurrency:
  group: desk-publish
  cancel-in-progress: false

jobs:
  keepalive:
    if: github.event_name == 'schedule' && github.event.schedule == '19 4 * * 1'
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write
    steps:
      - uses: liskin/gh-workflow-keepalive@v1

  publish:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - uses: actions/cache/restore@v4
        with:
          path: |
            .desk-posted.json
            .desk-archive.json
            .desk-open.json
            .desk-assets
          key: desk-state-${{ github.run_id }}
          restore-keys: |
            desk-state-
            desk-posted-
      - name: Build desk
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_CHANNEL_URL: ${{ secrets.TELEGRAM_CHANNEL_URL }}
          SITE_URL: https://labledgerdesk.pages.dev
        run: node scripts/build-desk.mjs
      - name: Publish public site
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          wranglerVersion: "4.135.0"
          command: deploy --config cloudflare/labledgerdesk.toml
      - name: Publish pages.dev
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          wranglerVersion: "4.135.0"
          command: pages deploy dist-site --project-name=labledgerdesk --branch=main --commit-dirty=true
      - name: Post to Telegram after pages exist
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_CHANNEL_URL: ${{ secrets.TELEGRAM_CHANNEL_URL }}
          TELEGRAM_WEBHOOK_URL: ${{ secrets.TELEGRAM_WEBHOOK_URL }}
          DESK_WORKER_URL: https://labledger-desk.halakou.workers.dev
          DISPATCH_TOKEN: ${{ secrets.DISPATCH_TOKEN }}
          SITE_URL: https://labledgerdesk.pages.dev
        run: node scripts/telegram-desk.mjs
      - name: Announce the cost ledger once
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_CHANNEL_URL: ${{ secrets.TELEGRAM_CHANNEL_URL }}
          SITE_URL: https://labledgerdesk.pages.dev
        run: node scripts/post-donate-announce.mjs
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: |
            .desk-posted.json
            .desk-archive.json
            .desk-open.json
            .desk-assets
          key: desk-state-${{ github.run_id }}
