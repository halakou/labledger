name: pages

on:
  push:
    branches: [main]
  schedule:
    # Every five minutes, off the hour. GitHub cron is best-effort;
    # a missed slot is five minutes, not an hour. Page first, then Telegram.
    - cron: "3,8,13,18,23,28,33,38,43,48,53,58 * * * *"
  workflow_dispatch:

concurrency:
  group: desk-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/cache/restore@v4
        with:
          path: |
            .desk-posted.json
            .desk-archive.json
            .desk-assets
          key: desk-state-${{ github.run_id }}
          restore-keys: |
            desk-state-
            desk-posted-
      - name: Build desk
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_CHANNEL_URL: ${{ secrets.TELEGRAM_CHANNEL_URL }}
          SITE_URL: https://labledgerdesk.pages.dev
        run: node scripts/build-desk.mjs
      - name: Publish public site
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          wranglerVersion: "4.135.0"
          command: deploy --config cloudflare/labledgerdesk.toml
      - name: Publish pages.dev
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          wranglerVersion: "4.135.0"
          command: pages deploy dist-site --project-name=labledgerdesk --branch=main --commit-dirty=true
      - name: Publish desk worker
        continue-on-error: true
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          wranglerVersion: "4.135.0"
          command: deploy --name labledger-desk --config cloudflare/wrangler.toml
      - name: Post to Telegram after pages exist
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_CHANNEL_URL: ${{ secrets.TELEGRAM_CHANNEL_URL }}
          TELEGRAM_WEBHOOK_URL: ${{ secrets.TELEGRAM_WEBHOOK_URL }}
          SITE_URL: https://labledgerdesk.pages.dev
        run: node scripts/telegram-desk.mjs
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: |
            .desk-posted.json
            .desk-archive.json
            .desk-assets
          key: desk-state-${{ github.run_id }}
