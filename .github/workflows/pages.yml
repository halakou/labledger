name: pages

on:
  push:
    branches: [main]
  schedule:
    # Hourly backup if the clock workflow is silent. GitHub keeps hourly.
    - cron: "8 * * * *"
    # Weekly re-enable so GitHub does not disable schedules after 60 quiet days.
    - cron: "19 4 * * 1"
  workflow_dispatch:
    inputs:
      announce_donate:
        description: "Post the donate announcement to Telegram"
        type: boolean
        default: false
  workflow_run:
    workflows: ["clock"]
    types: [completed]

concurrency:
  group: desk-publish
  cancel-in-progress: false

jobs:
  keepalive:
    if: github.event_name == 'schedule' && github.event.schedule == '19 4 * * 1'
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write
    steps:
      - uses: liskin/gh-workflow-keepalive@f72ff1a1336129f29bf0166c0fd0ca6cf1bcb38c # v1

  publish:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"
      - name: Gate before publish
        run: |
          node scripts/check-repo.mjs
          node --test test/*.test.mjs
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            .desk-posted.json
            .desk-archive.json
            .desk-open.json
            .desk-assets
          key: desk-state-${{ github.run_id }}
          restore-keys: |
            desk-state-
            desk-posted-
      - name: Build desk
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # C6: automation uses TELEGRAM_CHAT_ID only. Do not pass
          # TELEGRAM_CHANNEL_URL — it is not required and is unused in code.
          # C12: keep analytics OFF — do not set CF_ANALYTICS_TOKEN. No
          # beacon ships when the token is absent; leave the secret unset.
          CF_ANALYTICS_TOKEN: ${{ secrets.CF_ANALYTICS_TOKEN }}
          SITE_URL: https://labledgerdesk.pages.dev
        run: node scripts/build-desk.mjs
      - name: Refuse a build that is not safe to publish
        run: |
          test -f dist-site/_headers
          grep -q "Content-Security-Policy" dist-site/_headers
          grep -q "sha256-" dist-site/_headers
          grep -q "noindex" dist-site/404.html
          grep -q "X-Permitted-Cross-Domain-Policies" dist-site/_headers
          test -f dist-site/feed.json
          test -f dist-site/.well-known/security.txt
          ! grep -q "onclick=" dist-site/donate/index.html
      - name: Publish public site
        # C8: Pages is the canonical public origin (labledgerdesk.pages.dev is
        # the SITE_URL every canonical tag, the UA and the watchdog rely on),
        # and the Worker static-assets deploy is its mirror. Both are published
        # from this same dist-site directory on every run. Removing the Pages
        # step would freeze the public hostname the moment this workflow run
        # shipped, so it stays.
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          wranglerVersion: "4.135.0"
          command: pages deploy dist-site --project-name=labledgerdesk --branch=main --commit-dirty=true
      - name: Mirror the site to Worker static assets
        # C8: the second target is a mirror, not a second source of truth —
        # same directory, same run. It is the origin the watchdog worker talks
        # to, and it keeps serving if the Pages project is ever interrupted.
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          wranglerVersion: "4.135.0"
          command: deploy --config cloudflare/labledgerdesk.toml
      - name: Post to Telegram after pages exist
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_WEBHOOK_URL: ${{ secrets.TELEGRAM_WEBHOOK_URL }}
          DESK_WORKER_URL: https://labledger-desk.halakou.workers.dev
          DESK_AI_WORKER_URL: https://labledger-desk.halakou.workers.dev
          DISPATCH_TOKEN: ${{ secrets.DISPATCH_TOKEN }}
          ATRIA_API_KEY: ${{ secrets.ATRIA_API_KEY }}
          DESK_AI_TELEGRAM: ${{ vars.DESK_AI_TELEGRAM }}
          SITE_URL: https://labledgerdesk.pages.dev
        run: node scripts/telegram-desk.mjs
      - name: Announce the cost ledger once
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.announce_donate == 'true'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SITE_URL: https://labledgerdesk.pages.dev
        run: node scripts/post-donate-announce.mjs
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        if: always()
        with:
          path: |
            .desk-posted.json
            .desk-archive.json
            .desk-open.json
            .desk-assets
          key: desk-state-${{ github.run_id }}
