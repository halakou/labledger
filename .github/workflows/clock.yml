name: clock

# Independent ticker on GitHub's free scheduler. Completing this run
# starts pages.yml (site first, then Telegram). No Grok. No paid plan.
on:
  schedule:
    - cron: "4,14,24,34,44,54 * * * *"
    - cron: "17 4 * * 1"
  workflow_dispatch:

concurrency:
  group: desk-clock
  cancel-in-progress: false

jobs:
  keepalive:
    if: github.event_name == 'schedule' && github.event.schedule == '17 4 * * 1'
    runs-on: ubuntu-latest
    permissions:
      # actions: write lets it re-enable the schedule; contents: write lets it
      # push the touch-commit that resets GitHub's 60-day inactivity timer.
      actions: write
      contents: write
    steps:
      - uses: liskin/gh-workflow-keepalive@v1

  ping:
    runs-on: ubuntu-latest
    steps:
      - run: echo "desk clock"
